[package]
name = "owp-settlement"
version = "0.1.0"
edition = "2021"
description = "Local test-token escrow for OWP-backed delivery"

[lib]
crate-type = ["cdylib", "lib"]
name = "owp_settlement"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=1.2.0"
anchor-spl = { version = "=1.2.0", default-features = false, features = ["token", "token_2022"] }
